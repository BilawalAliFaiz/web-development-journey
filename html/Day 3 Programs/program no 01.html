<!DOCTYPE html>
<html>
<head>
    <title>Block and Inline Elements</title>
</head>
<body>

    <h1>This is a Heading</h1>
    <p>This is a paragraph.</p>

    <div>
        This is a div element.
    </div>

    <p>
        This is a paragraph with
        <span>an inline span</span>
        and
        <a href="#">an inline link</a>.
    </p>

    <p>
        <strong>Bold text</strong>
        <em>Italic text</em>
        <b>Bold</b>
        <i>Italic</i>
    </p>

</body>
</html>
