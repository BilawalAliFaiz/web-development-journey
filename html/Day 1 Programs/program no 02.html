<!DOCTYPE html>
<html>
<head>
    <title>Website Links</title>
</head>
<body>

    <h1>My Favorite Websites</h1>

    <p>
        Below are two website links. The first link will open in the same tab,
        while the second link will open in a new tab.
    </p>

    <h2>Same Tab Link</h2>
    <a href="https://www.google.com">Open Google</a>

    <h2>New Tab Link</h2>
    <a href="https://www.youtube.com" target="_blank">
        Open YouTube in a New Tab
    </a>

</body>
</html>
