<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Practice</title>
</head>
<body>

    <h1>My HTML Practice Page</h1>

    <p>
        This page contains an image and a table using rowspan and colspan.
        I am practicing different HTML elements.
    </p>

    <img src="image.png" alt="Practice Image" width="300">

    <h2>Student Information</h2>

    <table border="1">
        <tr>
            <th colspan="3">Student Details</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td rowspan="2">Bilawal</td>
            <td>HTML</td>
            <td>90</td>
        </tr>

        <tr>
            <td>CSS</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Ali</td>
            <td>HTML</td>
            <td>88</td>
        </tr>
    </table>

</body>
</html>
