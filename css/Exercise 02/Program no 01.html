
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 - Design a Card</title>
    <link rel="stylesheet" href="Program no 01.css">
</head>
<body>

    <div class="card">

        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Nature Image">

        <div class="tags">
            <span>Nature</span>
            <span>Travel</span>
        </div>

        <h1>Beautiful Nature</h1>

        <p>
            Nature is the most beautiful gift of life.
            Explore amazing places, enjoy fresh air,
            and discover the beauty of the world.
        </p>

        <button>Read More</button>

    </div>

</body>
</html>
